name: CI

on:
  push:
  pull_request:

jobs:
  test-and-cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Run tests
        run: go test ./...
      - name: Build Linux
        run: go build ./cmd/game-performance-advisor
      - name: Cross-build Windows
        run: GOOS=windows GOARCH=amd64 go build ./cmd/game-performance-advisor
      - name: Build Docker image
        run: docker build -t gpa .
      - name: Run Docker default
        run: docker run --rm gpa
      - name: Verify documented CLI scope
        run: |
          docker run --rm gpa --help
          docker run --rm gpa analyze --help
          docker run --rm gpa scan --help
          ! docker run --rm gpa compare
